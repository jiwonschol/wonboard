name: pages

# 소개 페이지(site/)를 GitHub Pages로 올린다.
# 저장소 Settings > Pages의 Source를 "GitHub Actions"로 켜야 배포된다. 켜기 전에는 배포를 건너뛴다.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/install/**
      - scripts/build-site.mjs
      - package.json
      - packages/locales/src/index.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/build-site.mjs  # 의존성 없이 돈다
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages가 꺼져 있어 배포를 건너뜁니다. Settings > Pages에서 Source를 GitHub Actions로 켠 뒤 이 워크플로를 다시 실행하세요."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
