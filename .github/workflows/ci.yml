name: ci

# PR마다 도는 Linux 기본 검사. main 보호 규칙의 필수 검사 `check`가 이 job 이름을 본다.
# paths 필터를 두지 말 것 — 필수 검사가 스킵되면 PR이 "Expected" 대기로 영원히 멈춘다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false  # pnpm은 다음 단계 corepack이 켠다
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
